name: Release native binaries

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable CLI tag to build and publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate:
    name: Validate immutable release tag
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ "$tag" =~ ^cli-v([0-9]+)\.([0-9]+)\.([0-9]+)-([0-9a-f]{12})$ ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            encoded_sha="${BASH_REMATCH[4]}"
          else
            echo "Expected cli-v<semver>-<12-char-sha>; got $tag" >&2
            exit 1
          fi
          grep -Eq "version=[\"']${version}[\"']" setup.py || { echo "setup.py must declare ${version}." >&2; exit 1; }
          grep -Eq "__version__[[:space:]]*=[[:space:]]*[\"']${version}[\"']" diffgraph/__init__.py || { echo "diffgraph/__init__.py must declare ${version}." >&2; exit 1; }
          sha="$(git rev-parse HEAD)"
          if [[ "${sha:0:12}" != "$encoded_sha" ]]; then
            echo "Tag $tag must encode the checked-out commit; got $sha" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            asset: wild-linux-x64
            smoke: ./release/wild-linux-x64 --help
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            asset: wild-linux-arm64
            smoke: ./release/wild-linux-arm64 --help
          - target: macos-x64
            runner: macos-15-intel
            asset: wild-macos-x64
            smoke: ./release/wild-macos-x64 --help
          - target: macos-arm64
            runner: macos-15
            asset: wild-macos-arm64
            smoke: ./release/wild-macos-arm64 --help
          - target: windows-x64
            runner: windows-latest
            asset: wild-win.exe
            smoke: ./release/wild-win.exe --help

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build native executable
        run: python build.py --output-dir release --name wild
      - name: Name release asset
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            mv release/wild.exe "release/${{ matrix.asset }}"
          else
            mv release/wild "release/${{ matrix.asset }}"
          fi
      - name: Smoke test native executable
        shell: bash
        run: ${{ matrix.smoke }}
      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify assets and create release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable tag still resolves to the validated source
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test "$tag_sha" = "$SOURCE_SHA" || {
            echo "Tag ${RELEASE_TAG} resolves to $tag_sha, not validated source $SOURCE_SHA." >&2
            exit 1
          }
      - name: Download all native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Fail closed and write checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            wild-linux-x64
            wild-linux-arm64
            wild-macos-x64
            wild-macos-arm64
            wild-win.exe
          )

          for asset in "${expected[@]}"; do
            test -f "release/${asset}" || {
              echo "Missing expected release asset: ${asset}" >&2
              exit 1
            }
          done

          actual_count="$(find release -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "${actual_count}" -eq "${#expected[@]}" || {
            echo "Expected exactly ${#expected[@]} binaries, found ${actual_count}" >&2
            find release -maxdepth 1 -type f -printf '%f\n' >&2
            exit 1
          }

          (
            cd release
            sha256sum "${expected[@]}" > SHA256SUMS
          )

          node - <<'NODE'
          const fs = require('node:fs');
          const assets = [
            'wild-linux-x64',
            'wild-linux-arm64',
            'wild-macos-x64',
            'wild-macos-arm64',
            'wild-win.exe',
          ];
          fs.writeFileSync('release/cli-manifest.json', JSON.stringify({
            schemaVersion: 1,
            version: process.env.RELEASE_TAG,
            sourceCommit: process.env.SOURCE_SHA,
            assets,
          }, null, 2) + '\n');
          NODE
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" \
            --generate-notes
