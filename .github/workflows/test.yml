name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . pytest jsonschema

      - name: Require phase-one dependencies
        run: |
          python -c "import jsonschema; from diffgraph.processing_modes.tree_sitter_dependency import TreeSitterProcessor"

      - name: Run phase-one acceptance tests
        run: python -m pytest tests/test_tree_sitter_phase1.py

      - name: Run full test suite
        run: python -m pytest
